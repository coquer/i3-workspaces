name: QML Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: Run qmllint
        run: find . -name "*.qml" -not -path "./.git/*" -print0 | xargs -0 qmllint
