name: QML Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
          QMLLINT=$(dpkg -L qt6-declarative-dev-tools | grep -m1 '/qmllint6\?$')
          echo "QMLLINT=$QMLLINT" >> "$GITHUB_ENV"
      - name: Run qmllint
        run: |
          set +e
          out=$(find . -name "*.qml" -not -path "./.git/*" -print0 | xargs -0 "$QMLLINT" 2>&1)
          echo "$out"
          echo "$out" | grep -q '^Error:' && exit 1
          exit 0
